[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mypeople"
version = "0.3.3"
description = "Self-hostable runtime that orchestrates Claude Code and Codex agents as a team"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "plow.co" }]
keywords = ["agents", "claude", "codex", "orchestration", "self-hosted"]
dependencies = []

[project.scripts]
mypeople = "mypeople.cli:main"

[tool.hatch.version]
path = "mypeople/__init__.py"

# The runtime/ tree ships as package data (daemons, HTML, doctrine, verify harness,
# tmux config, hook plugins, skel dirs). hatchling's default package inclusion picks up
# every file under mypeople/ regardless of extension — including the suffixless scripts
# (mp, board-restore) and skel/*/.gitkeep that first-run's materialize() expects.
[tool.hatch.build.targets.wheel]
packages = ["mypeople"]

[tool.hatch.build.targets.sdist]
include = [
  "mypeople",
  "LICENSE",
  "README.md",
  "pyproject.toml",
]
