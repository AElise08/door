# Template: TLS in front of the panel. The panel itself only listens on 127.0.0.1.
server {
    listen 443 ssl http2;
    server_name panel.YOUR-DOMAIN;
    ssl_certificate     /etc/letsencrypt/live/panel.YOUR-DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.YOUR-DOMAIN/privkey.pem;
    client_max_body_size 2m;
    # Admin API is only reachable from the operator's IP.
    location /admin/ { allow YOUR.OFFICE.IP; deny all; proxy_pass http://127.0.0.1:9630; }
    location / {
        proxy_pass http://127.0.0.1:9630;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    add_header Strict-Transport-Security "max-age=31536000" always;
}
server { listen 80; server_name panel.YOUR-DOMAIN; return 301 https://$host$request_uri; }
